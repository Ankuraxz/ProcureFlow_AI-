# ==============================================================================
# ProcureFlow AI — Nginx SPA + SSE Reverse Proxy Configuration
# Substitutes ${GATEWAY_URL} at container startup via NGINX_ENVSUBST_FILTER.
# ==============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight container health probe endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy /api/* requests (including long-lived SSE streams) to Concierge Gateway
    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Critical for real-time Server-Sent Events (SSE) A2UI & trace streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy gateway health check if queried directly from UI origin
    location = /health {
        proxy_pass ${GATEWAY_URL}/health;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
    }

    # Cache immutable fingerprinted Vite assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML5 History API SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
