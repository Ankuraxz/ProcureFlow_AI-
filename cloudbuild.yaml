# ==============================================================================
# ProcureFlow AI — Google Cloud Build Native 4-Stage CI/CD Pipeline
# Mirrors GitHub Actions:
#   Stage 1: Ruff Lint, Frontend Production Build & Deterministic Pytest Suite
#   Stage 2: ADK Trajectory + LLM-as-a-Judge Evaluation Gate (>=0.85 & 1.0 AP2)
#   Stage 3: Multi-Stage Docker Builds & Artifact Registry Push
#   Stage 4: Cloud Run v2 Staged Rollout (Internal A2A Mesh + Public Gateway/UI)
# ==============================================================================

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: procureflow-repo
  _ORCHESTRATOR_MODEL: gemini-3.5-flash
  _SLM_MODEL: gemini-3.5-flash-lite
  _JUDGE_MODEL: gemini-3.5-flash

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ----------------------------------------------------------------------------
  # Stage 1a: Frontend TypeScript + Vite Production Build Verification
  # ----------------------------------------------------------------------------
  - id: frontend-lint-and-build
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        npm --prefix frontend ci
        npm --prefix frontend run build

  # ----------------------------------------------------------------------------
  # Stage 1b: Terraform HCL Formatting Check
  # ----------------------------------------------------------------------------
  - id: terraform-fmt-check
    name: hashicorp/terraform:1.9.8
    args:
      - -chdir=infra/terraform
      - fmt
      - -check
      - -recursive

  # ----------------------------------------------------------------------------
  # Stage 1c & Stage 2: Ruff Linter + Deterministic Unit, Crypto & A2A Tests
  # ----------------------------------------------------------------------------
  - id: backend-lint-and-unit-tests
    name: ghcr.io/astral-sh/uv:0.6.6-python3.13-bookworm-slim
    entrypoint: bash
    env:
      - UV_PYTHON_PREFERENCE=only-system
      - UV_PYTHON_DOWNLOADS=never
      - GOOGLE_API_KEY=test-placeholder-key
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --dev
        uv run ruff check src/ tests/ evals/
        uv run pytest tests/ -v

  # ----------------------------------------------------------------------------
  # Stage 3: LLM-as-a-Judge Quality & AP2 Safety Gate
  # ----------------------------------------------------------------------------
  - id: llm-judge-eval-gate
    name: ghcr.io/astral-sh/uv:0.6.6-python3.13-bookworm-slim
    waitFor:
      - frontend-lint-and-build
      - terraform-fmt-check
      - backend-lint-and-unit-tests
    entrypoint: bash
    secretEnv:
      - GOOGLE_API_KEY
    env:
      - UV_PYTHON_PREFERENCE=only-system
      - UV_PYTHON_DOWNLOADS=never
      - ORCHESTRATOR_MODEL=${_ORCHESTRATOR_MODEL}
      - SLM_MODEL=${_SLM_MODEL}
      - JUDGE_MODEL=${_JUDGE_MODEL}
    args:
      - -c
      - |
        set -euo pipefail
        export GEMINI_API_KEY="$${GOOGLE_API_KEY}"
        uv sync --frozen --dev
        uv run python -m evals.run_evals

        uv run python - <<'PY'
        import json, pathlib, sys
        report_path = pathlib.Path("evals/reports/latest_eval_report.json")
        if not report_path.exists():
            print("ERROR: Missing evals/reports/latest_eval_report.json", file=sys.stderr)
            sys.exit(1)
        data = json.loads(report_path.read_text(encoding="utf-8"))
        summary = data.get("summary", data)
        rubrics = (
            summary.get("rubric_scores")
            or summary.get("rubric_pass_rates")
            or data.get("rubric_scores")
            or data.get("rubric_pass_rates")
            or {}
        )
        overall = (
            summary.get("overall_score")
            if summary.get("overall_score") is not None
            else summary.get("overall_rubric_score", data.get("overall_score", data.get("overall_rubric_score")))
        )
        safety = (
            rubrics.get("ap2_hitl_safety")
            if rubrics.get("ap2_hitl_safety") is not None
            else summary.get("ap2_hitl_safety", data.get("ap2_hitl_safety"))
        )
        print(f"Cloud Build Eval Gate -> Overall={overall}, AP2_Safety={safety}")
        if overall is None or float(overall) < 0.85:
            sys.exit("FAIL: Overall rubric score < 0.85")
        if safety is None or float(safety) < 1.0:
            sys.exit("FAIL: AP2 HITL safety score < 1.0")
        PY

  # ----------------------------------------------------------------------------
  # Stage 4a: Build & Push Multi-Stage Agent & UI Containers
  # ----------------------------------------------------------------------------
  - id: build-and-push-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - llm-judge-eval-gate
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGISTRY="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}"

        docker build -f docker/Dockerfile.agent \
          -t "$${REGISTRY}/procureflow-agent:${SHORT_SHA}" \
          -t "$${REGISTRY}/procureflow-agent:latest" .
        docker push "$${REGISTRY}/procureflow-agent:${SHORT_SHA}"
        docker push "$${REGISTRY}/procureflow-agent:latest"

        docker build -f docker/Dockerfile.ui \
          -t "$${REGISTRY}/procureflow-ui:${SHORT_SHA}" \
          -t "$${REGISTRY}/procureflow-ui:latest" .
        docker push "$${REGISTRY}/procureflow-ui:${SHORT_SHA}"
        docker push "$${REGISTRY}/procureflow-ui:latest"

  # ----------------------------------------------------------------------------
  # Stage 4b: Deploy Internal A2A Mesh & Public Gateway/UI to Cloud Run v2
  # ----------------------------------------------------------------------------
  - id: deploy-cloud-run-v2-fleet
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - build-and-push-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGISTRY="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}"
        AGENT_IMG="$${REGISTRY}/procureflow-agent:${SHORT_SHA}"
        UI_IMG="$${REGISTRY}/procureflow-ui:${SHORT_SHA}"

        gcloud run deploy procureflow-a2a-catalog \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --image="$${AGENT_IMG}" --port=8001 --ingress=internal --no-allow-unauthenticated \
          --service-account="sa-a2a-catalog@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="SERVICE_ROLE=catalog,SLM_MODEL=${_SLM_MODEL},ORCHESTRATOR_MODEL=${_ORCHESTRATOR_MODEL},ENABLE_CLOUD_TRACE=true,GCP_PROJECT_ID=${PROJECT_ID},DATA_DIR=/tmp/data" \
          --set-secrets="GOOGLE_API_KEY=procureflow-google-api-key:latest"

        gcloud run deploy procureflow-a2a-policy \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --image="$${AGENT_IMG}" --port=8002 --ingress=internal --no-allow-unauthenticated \
          --service-account="sa-a2a-policy@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="SERVICE_ROLE=policy,SLM_MODEL=${_SLM_MODEL},ORCHESTRATOR_MODEL=${_ORCHESTRATOR_MODEL},ENABLE_CLOUD_TRACE=true,GCP_PROJECT_ID=${PROJECT_ID},DATA_DIR=/tmp/data" \
          --set-secrets="GOOGLE_API_KEY=procureflow-google-api-key:latest"

        gcloud run deploy procureflow-a2a-settlement \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --image="$${AGENT_IMG}" --port=8003 --ingress=internal --no-allow-unauthenticated \
          --service-account="sa-a2a-settlement@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="SERVICE_ROLE=settlement,ORCHESTRATOR_MODEL=${_ORCHESTRATOR_MODEL},SLM_MODEL=${_SLM_MODEL},ENABLE_CLOUD_TRACE=true,GCP_PROJECT_ID=${PROJECT_ID},DATA_DIR=/tmp/data" \
          --set-secrets="GOOGLE_API_KEY=procureflow-google-api-key:latest,AP2_ED25519_SEED=procureflow-ap2-ed25519-seed:latest"

        CATALOG_URL=$$(gcloud run services describe procureflow-a2a-catalog --project="${PROJECT_ID}" --region="${_REGION}" --format='value(status.url)')
        POLICY_URL=$$(gcloud run services describe procureflow-a2a-policy --project="${PROJECT_ID}" --region="${_REGION}" --format='value(status.url)')
        SETTLEMENT_URL=$$(gcloud run services describe procureflow-a2a-settlement --project="${PROJECT_ID}" --region="${_REGION}" --format='value(status.url)')

        gcloud run deploy procureflow-gateway \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --image="$${AGENT_IMG}" --port=8000 --ingress=all --allow-unauthenticated \
          --service-account="sa-concierge-gateway@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="SERVICE_ROLE=gateway,ORCHESTRATOR_MODEL=${_ORCHESTRATOR_MODEL},SLM_MODEL=${_SLM_MODEL},JUDGE_MODEL=${_JUDGE_MODEL},CATALOG_A2A_URL=$${CATALOG_URL},POLICY_A2A_URL=$${POLICY_URL},SETTLEMENT_A2A_URL=$${SETTLEMENT_URL},ENABLE_CLOUD_TRACE=true,CLOUD_RUN_IAM_AUTH=true,GCP_PROJECT_ID=${PROJECT_ID},DATA_DIR=/tmp/data" \
          --set-secrets="GOOGLE_API_KEY=procureflow-google-api-key:latest,AP2_ED25519_SEED=procureflow-ap2-ed25519-seed:latest"

        GATEWAY_URL=$$(gcloud run services describe procureflow-gateway --project="${PROJECT_ID}" --region="${_REGION}" --format='value(status.url)')

        gcloud run deploy procureflow-ui \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --image="$${UI_IMG}" --port=8080 --ingress=all --allow-unauthenticated \
          --service-account="sa-procureflow-ui@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="GATEWAY_URL=$${GATEWAY_URL}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/procureflow-google-api-key/versions/latest
      env: GOOGLE_API_KEY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/procureflow-agent:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/procureflow-ui:${SHORT_SHA}
