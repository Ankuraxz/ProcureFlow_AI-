[project]
name = "procureflow-ai"
version = "0.1.0"
description = "ProcureFlow AI — Autonomous Enterprise Procurement & Spend Desk built with Google ADK, Gemini, A2A, A2UI, and AP2"
readme = "README.md"
authors = [
    { name = "Ankur", email = "34418414+Ankuraxz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "google-adk[a2a,eval]>=2.15.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
procureflow-ai = "procureflow_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procureflow_ai"]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["procureflow_ai", "evals"]

